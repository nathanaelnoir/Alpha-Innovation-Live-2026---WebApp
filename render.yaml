# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: conference-survey-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    domains:
      - api.eigenvalue.space
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: conference-survey-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://eigenvalue.space
      - key: PRESENTATION_ORIGIN
        fromService:
          type: web
          name: conference-survey-presentation
          envVarKey: RENDER_EXTERNAL_URL
      - key: PARTICIPANT_TOKEN_SECRET
        generateValue: true
      - key: RESULTS_EXPORT_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.14.3

  - type: web
    name: conference-survey-web
    runtime: static
    rootDir: frontend
    domains:
      - eigenvalue.space
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.eigenvalue.space
      - key: NODE_VERSION
        value: 22.22.1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: conference-survey-presentation
    runtime: static
    rootDir: presentation
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.eigenvalue.space
      - key: NODE_VERSION
        value: 22.22.1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: conference-survey-db
    plan: basic-256mb
    region: frankfurt
    databaseName: conference_survey
    user: conference_survey
    ipAllowList: []
    connectionPool: none
